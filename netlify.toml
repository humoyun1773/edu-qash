[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Production da VITE_API_BASE_URL bo'sh — barcha so'rovlar relative yo'l orqali
  # Netlify proxy qoidalari orqali backend ga yo'naltiriladi
  VITE_API_BASE_URL = ""

# ─── API Proxy — Mixed Content yechimi ──────────────────────────────────────
# HTTPS frontenddan HTTP backendga Netlify server-side proxy orqali
# Brauzer faqat HTTPS ko'radi → Mixed Content xatosi yo'q

[[redirects]]
  from   = "/api/*"
  to     = "http://169.58.72.177/api/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/auth/*"
  to     = "http://169.58.72.177/auth/:splat"
  status = 200
  force  = true


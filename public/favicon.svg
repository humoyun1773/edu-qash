<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background rounded square with gradient -->
  <rect width="64" height="64" rx="14" fill="url(#bg_grad)"/>
  
  <!-- Graduation cap mortarboard -->
  <!-- Board top flat part -->
  <path d="M32 12L8 24L32 36L56 24L32 12Z" fill="url(#cap_grad)" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Left side of the cap tassel line -->
  <line x1="8" y1="24" x2="8" y2="38" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Tassel ball -->
  <circle cx="8" cy="40" r="2.5" fill="#f59e0b"/>
  <!-- Body below cap (cylinder base) -->
  <path d="M20 30.5V40C20 45.523 25.373 50 32 50C38.627 50 44 45.523 44 40V30.5" fill="url(#body_grad)" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Star sparkle top-right -->
  <path d="M49 11L50.2 14.4L54 15L50.2 15.6L49 19L47.8 15.6L44 15L47.8 14.4L49 11Z" fill="#fbbf24"/>

  <defs>
    <linearGradient id="bg_grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="cap_grad" x1="8" y1="12" x2="56" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="body_grad" x1="20" y1="30" x2="44" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
</svg>